<div class="hv-modal-overlay" id="auth-modal">
    <div class="hv-modal-card">

        <label for="modal-toggle" class="hv-btn-close" id="btn-close-modal">&times;</label>
        <div class="hv-modal-logo">
            <img src="https://images.icon-icons.com/1949/PNG/512/free-30-instagram-stories-icons53_122600.png"
                alt="logo huellavet" height="50" class="object-fit-contain">
            <span id="hv-modal-marca">
                HuellaVet
            </span>
        </div>
        <input type="radio" name="hv-tab" id="hv-tab-login" class="d-none" checked>
        <input type="radio" name="hv-tab" id="hv-tab-register" class="d-none">

        <div class="hv-tabs">
            <label for="hv-tab-login" class="hv-tab-label">Iniciar Sesión</label>
            <label for="hv-tab-register" class="hv-tab-label">Registro</label>
        </div>

        <form class="hv-form hv-form-login">
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Nombre de usuario o correo" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Recordarme</label>
                </div>
                <a href="#" class="small text-decoration-none text-danger">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="boton-login">
                <button type="submit" class="btn-sesion">Iniciar sesión</button>
            </div>
        </form>

        <form class="hv-form hv-form-register">
            <div class="register-datos">
                <div class="mb-3 campo-formulario">
                    <label for="firstname" class="form-label">Nombre(s)</label>
                    <input type="text" class="form-control" id="firstname" name="name" placeholder="Nombre(s)" required>
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="last-name" class="form-label">Apellido(s)</label>
                    <input type="text" class="form-control" id="last-name" name="lastname" placeholder="Apellido(s)"
                        required>
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="email" class="form-label">Correo Eletronico</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com"
                        required>
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="city" class="form-label"> Ciudad</label>
                    <select class="form-select" name="city" id="city" required>
                        <option selected disabled>Selecciona una Ciudad</option>
                        <option value="1">Bogotá</option>
                        <option value="2">Manizales</option>
                        <option value="3">Pereira</option>
                    </select>
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="telephone" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telephone" name="telephone"
                        placeholder="Teléfono: 000 0000000">
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="date" class="form-label"> Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="date" name="date">
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="pass" class="form-label">Digita una contraseña</label>
                    <input type="password" class="form-control" id="pass" name="password" placeholder="Contraseña"
                        required>
                </div>
                <div class="mb-3 campo-formulario">
                    <label for="confirmpass" class="form-label">Confirma la contraseña</label>
                    <input type="password" class="form-control" id="confirmpass" name="confirmpassword"
                        placeholder="Confirmar Contraseña" required>
                </div>
                <div class="form-check mb-2 condiciones-formulario">
                    <input class="form-check-input" type="checkbox" id="privacy" name="privacy" required>
                    <label class="form-check-label" for="privacy">He leido y acepto la <a href="politicas.html">Política
                            de
                            privacidad</a></label>
                </div>
                <div class="form-check mb-4 condiciones-formulario">
                    <input class="form-check-input" type="checkbox" id="conditions" name="conditions" required>
                    <label class="form-check-label" for="conditions">He leido y acepto los <a
                            href="terminos.html">Terminos y
                            condiciones</a></label>
                </div>
                <div class="boton-registro">
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </div>
            </div>
        </form>
    </div>
</div>
