<!-- formulario-contacto.html
 reo la etiqueta main para indicar que aquí 
 comienza el contenido principal de mi página -->
<main class="contacto">

    <!-- Con section se agrupar todo el contenido del formulario y
     se uso la clase contacto__contenedor para aplicar mis estilos 
     propios y también se usa la clase container de Bootstrap para 
     centrar el contenido y controlar su ancho en diferentes tamaños 
     de pantalla-->
    <section class="Contacto_contenedor container">

        <!-- Formilario de Contacto
         Con div que funcionará como la tarjeta principal
         donde voy a colocar todo el formulario-->
        <div class="formulario-contacto">

            <!-- Con form el formulario que recogerá la información 
             del usuario y con id identifico este formulario de manera 
             única para poder trabajarlo después desde JavaScript

             En action voy a colocar el enlace real que me entregue 
             Formspree y con method="POST" indico que los datos 
             se enviarán de forma privada dentro de la solicitud-->
            <form id="formulario-contacto" action="https://formspree.io/f/ID-DEL-FORMULARIO" method="POST">

                <!-- Campos del formulario LIZETH
                 se crea una sección específica para agrupar los datos personales 
                 del propietario de la mascota-->
                <section class="formulario-contacto__propietario">

                    <!-- Se crea un contenedor para organizar el icono y el titulo
                     principal del formulario-->
                    <div class="formulario-contacto__encabezado">

                        <!-- Se crea un contenedor para darle fondo, tamaño
                        y forma al icono del encabezado-->
                        <div class="formulario-contacto__icono-titulo">

                            <!-- Se insserta un icono de sobre usando Bootstrap Icons
                             para representar el envío de un mensaje-->
                            <i class="bi bi-envelope-fill"></i>

                            <!-- Cierro el contenedor del icono del título -->
                        </div>

                        <!-- Ahora creo el título principal de mi formulario y uso
                         un h2 porque es uno de los títulos principales dentro 
                         de esta sección-->
                        <h2 class="formulario-contacto__titulo">

                            <!-- Escribo el texto que verá el usuario-->
                            Envíame un mensaje

                            <!-- Cierro el título principal. -->
                        </h2>


                        <!-- Cierro el encabezado del formulario-->
                    </div>

                    <!-- Ahora se crea una fila usando el sistema de 
                      cuadrícula de Bootstrap y la clase row crea la 
                      fila.
                      
                      La clase g-3 agrega una separación uniforme
                      entre los campos del formulario-->
                    <div class="row g-3">

                        <!-- Se crea una columna para el campo del 
                         nombre y con col-12 hago que ocupe todo el 
                         ancho en celulares.

                         Con col-md-6 hago que ocupe la mitad del 
                         ancho desde pantallas medianas en adelante-->
                        <div class="col-12 col-md-6">

                            <!-- Ahora creo una etiqueta para 
                             identificar el campo del nombre del 
                             propietario y el atributo for debe 
                             coincidir con el id del input al que 
                             pertenece-->
                            <label for="nombre-propietario" class="form-label">

                                <!-- Escribo el nombre visible del campo. -->
                                Nombre del propietario

                                <!-- Cierro la etiqueta del nombre-->
                            </label>

                            <!-- Ahora creo un contenedor para 
                              organizar el icono y el campo de texto-->
                            <div class="formulario-contacto__campo">

                                <!-- Inserto un icono de persona
                                 para representar al propietario-->
                                <i class="bi bi-person"></i>

                                <!--Ahora creo un campo de texto
                                 para que el usuario escriba su nombre-->

                                <!--Indico con type="text" que este campo recibe texto-->

                                <!-- Asigno con id="nombre-propietario" un identificador único al campo y
                                  este id también permite conectar y el input con su label-->

                                <!-- Despues con class="form-control" Se aplica la clase form-control de Bootstrap
                                    para darle apariencia de campo de formulario-->

                                <!-- Y con placeholder="Tu nombre" se muestra un ejemplo dentro del campo
                                     antes de que el usuario escriba-->

                                <!-- Ahora con required Se indica que este campo debe completarse
                                       antes de enviar el formulario-->

                                <input type="text" id="nombre-propietario" name="nombre_propietario"
                                    class="form-control" placeholder="Tu nombre" autocomplete="name" required>

                                <!-- Cierro el contenedor del campo del nombre-->
                            </div>

                            <!-- Cierro la columna del nombre del propietario-->
                        </div>

                        <!-- Se crea una columna para el teléfono y en celular ocupará 
                         todo el ancho y en pantallas medianas ocupará la mitad-->
                        <div class="col-12 col-md-6">

                            <!-- Se crea la etiqueta que identifica y 
                            el campo del teléfono-->

                            <label for="telefono" class="form-label">

                                <!-- Escribo el nombre visible del campo-->
                                Teléfono

                                <!-- Cierro la etiqueta del teléfono-->
                            </label>

                            <!-- Se crea un contenedor para organizar
                             el icono y el campo del teléfono-->

                            <div class="formulario-contacto__campo">

                                <!-- Se inserta un icono de teléfono
                                 usando Bootstrap Icons-->
                                <i class="bi bi-telephone"></i>

                                <!-- Se crea un campo especializado
                                  para recibir números telefónicos
                                  
                                  Uso type="tel" para indicar que este campo recibe un 
                                  teléfono, Asigno un identificador único con id="telefono",
                                   y con name="telefono" y con 
                                   class="form-control" aplico el diseño de Bootstrap con
                                   placeholder="+57 300 123 4567" doy un ejemplo de cómo se debe ingresar y con
                                    autocomplete="tel" indico que el navegador puede autocompletar este campo con un teléfono guardado,
                                    y con pattern="[0-9+\s()-]{7,20}" indico que el campo solo acepta números, espacios, paréntesis, guiones y el signo 
                                    + y con required indico que este campo es obligatorio para enviar el formulario.
                                  
                                  -->
                                <input type="tel" id="telefono" name="telefono" class="form-control"
                                    placeholder="+57 300 123 4567" autocomplete="tel" pattern="[0-9+\s()-]{7,20}"
                                    required>

                                <!-- Cierro el contenedor del teléfono-->
                            </div>


                            <!-- Cierro la columna del teléfono-->
                        </div>

                        <!--Creo una columna para la dirección y 
                         en celular ocupará todo el ancho y en pantallas medianas ocupará la mitad-->
                        <div class="col-12 col-md-6">

                            <!--Creo la etiqueta que identifica el campo de la dirección-->
                            <label for="direccion" class="form-label">

                                <!-- Escribo el nombre visible del campo-->
                                Dirección


                                <!-- Cierro la etiqueta de la dirección-->
                            </label>

                            <!-- Ahora creo un contenedor para organizar
                             el icono y el campo de dirección-->
                            <div class="formulario-contacto__campo">

                                <!-- Ahora inserto un icono de ubicación
                                 para representar la dirección-->
                                <i class="bi bi-geo-alt"></i>

                                <!-- Ahora Se crea un campo de texto
                                  para que el usuario escriba su dirección con
                                    type="text" indico que es un campo de texto,
                                    id="direccion" asigno un identificador único al campo y
                                    name="direccion" asigno un nombre al campo para que se pueda identificar en el envío
                                    class="form-control" aplico el diseño de Bootstrap con
                                    placeholder="Calle 123 #45-67, Ciudad, País" doy un ejemplo de cómo se debe ingresar y con 
                                    autocomplete="street-address" indico que el navegador puede autocompletar este campo con una dirección guardada-->
                                <input type="text" id="direccion" name="direccion" class="form-control"
                                    placeholder="Calle 123 #45-67, Ciudad, País" autocomplete="street-address">


                                <!-- Cierro el contenedor de la dirección-->
                            </div>



                            <!-- Cierro la columna de la dirección-->
                        </div>

                        <!-- Se crea una columna para el correo electrónico y en celular 
                         ocupará todo el ancho y desde pantallas medianas ocupará la mitad-->
                        <div class="col-12 col-md-6">

                            <!--Se crea la etiqueta que identifica el campo del correo electrónico.-->
                            <label for="correo" class="form-label">

                                <!-- Escribo el nombre visible del campo-->
                                Correo electrónico

                            <!-- Cierro la etiqueta del correo-->
                            </label>

                            <!--Creo un contenedor para organizar
                             el icono y el campo del correo-->
                             <div class="formulario-contacto__campo">

                                <!-- Se inserta un icono de sobre para representar 
                                 el correo electrónico-->
                                 <i class="bi bi-envelope"></i>

                                 <!-- Ahora Se crea un campo especializado
                                  para recibir direcciones de correo
                                  
                                  Uso type="email" para que el navegador y 
                                  valide que el formato tenga estructura de correo y
                                  Asigno un identificador único con id="correo", y con name="correo" asigno un nombre al campo 
                                  para que se pueda identificar en el envío y con class="form-control" 
                                  aplico el diseño de Bootstrap con placeholder="correo@ejemplo.com" 
                                  doy un ejemplo de cómo se debe ingresar y con autocomplete="email" 
                                  indico que el navegador puede autocompletar este campo con un correo 
                                  guardado y con required indico que este campo es obligatorio 
                                  para enviar el formulario-->
                                  <input type="email" id="correo" name="correo" class="form-control"
                                    placeholder="correo@ejemplo.com" autocomplete="email" required>


                             <!-- Cierro el contenedor del correo-->
                            </div>

                        <!-- Cierro la columna del correo-->
                        </div>





                    <!-- Cierro la fila que contiene mis cuatro campos-->
                    </div>


                <!-- Cierro mi sección de datos del propietario-->
                </section>

                <!-- Aqui termino mi parte del formulario LIZETH-->

                <!-- Aqui Empezaria la seccion de mi compañera tatiana -->

            </form>







        </div>



    </section>



</main>
