<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | HuellaVet</title>

    <!-- Conecto Bootstrap para utilizar su sistema de columnas y formularios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Conecto Bootstrap Icons para usar los iconos del formulario -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Conecto las fuentes definidas para la identidad de HuellaVet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        /* Se crean variables para reutilizar los colores y fuentes del proyecto */
        :root {
            --color-primario: #17a9a7;
            --color-primario-oscuro: #007981;
            --color-secundario-claro: #a5d9cf;
            --color-acento: #bad641;
            --color-fondo-claro: #eef5e5;
            --color-texto-oscuro: #223e3c;
            --color-borde: #d8e3df;

            --fuente-principal: "Quicksand", sans-serif;
            --fuente-marca: "Sour Gummy", sans-serif;
        }

        /* Se aplica la fuente principal a toda mi página de prueba */
        body {
            font-family: var(--fuente-principal);
            color: var(--color-texto-oscuro);
            background-color: #f7faf8;
        }

        /* Se crea la estructura principal del menú lateral*/
        .hv-sidebar {
            width: 270px;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background-color: var(--color-texto-oscuro);
            color: #ffffff;

            display: flex;
            flex-direction: column;
        }

        /* Se organiza el icono y el nombre HuellaVet */
        .hv-sidebar__marca {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0 0.5rem;
        }

        /* Se aplica el tamaño necesario al logo de HuellaVet */
        .hv-sidebar__logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            flex-shrink: 0;

            object-fit: cover;
            transform: scale(1.25);
        }

        /* Se aplica la fuente de marca al nombre HuellaVet*/
        .hv-sidebar__marca span {
            font-family: var(--fuente-marca);
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Se organiza el menú principal del sidebar */
        .hv-sidebar__menu {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 3rem;
        }

        /* Se aplica el estilo general a cada opción del menú */
        .hv-sidebar__link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.95rem 1rem;
            color: #ffffff;
            text-decoration: none;
            border-radius: 0.75rem;
            font-size: 1rem;
        }

        /* Se da tamaño uniforme a los iconos del menú */
        .hv-sidebar__link i {
            width: 1.5rem;
            font-size: 1.25rem;
            text-align: center;
        }

        /* Se cambia ligeramente el fondo al pasar el mouse */
        .hv-sidebar__link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Se destaca la opción activa del menú */
        .hv-sidebar__link--activo {
            color: var(--color-texto-oscuro);
            background-color: var(--color-acento);
            font-weight: 700;
        }

        /* Se conserva el color de la opción activa al pasar el mouse */
        .hv-sidebar__link--activo:hover {
            color: var(--color-texto-oscuro);
            background-color: var(--color-acento);
        }



        /* Se ubica el bloque de ayuda cerca de la parte inferior */
        .hv-sidebar__soporte {
            margin-top: auto;
            padding: 1.25rem;
            background-color: rgba(255, 255, 255, 0.06);
            border-radius: 0.85rem;
        }

        /* Se aplica estilo al título del bloque de ayuda */
        .hv-sidebar__soporte h3 {
            margin-bottom: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
        }

        /* Se aplica estilo al mensaje de ayuda */
        .hv-sidebar__soporte p {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--color-secundario-claro);
        }

        /* Se diseña el botón de soporte */
        .hv-sidebar__boton-soporte {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            color: var(--color-texto-oscuro);
            background-color: var(--color-acento);
            text-decoration: none;
            border-radius: 0.6rem;
            font-weight: 700;
        }

        /* Se conserva el estilo del botón al pasar el mouse */
        .hv-sidebar__boton-soporte:hover {
            color: var(--color-texto-oscuro);
            background-color: var(--color-acento);
        }

        /* Adapto el sidebar para pantallas medianas */
        @media (max-width: 992px) {
            .hv-sidebar {
                width: 220px;
                padding: 1.5rem 1rem;
            }

            .hv-sidebar__marca span {
                font-size: 1.5rem;
            }

            .hv-sidebar__link {
                font-size: 0.95rem;
            }
        }

        /* Adapto el sidebar para pantallas pequeñas */
        @media (max-width: 768px) {
            .hv-sidebar {
                width: 90px;
                padding: 1.5rem 0.75rem;
            }

            .hv-sidebar__marca {
                justify-content: center;
            }

            .hv-sidebar__marca span {
                display: none;
            }

            .hv-sidebar__menu {
                margin-top: 2rem;
            }

            .hv-sidebar__link {
                justify-content: center;
                padding: 0.9rem;
            }

            .hv-sidebar__link span {
                display: none;
            }

            .hv-sidebar__link i {
                width: auto;
                font-size: 1.35rem;
            }

            .hv-sidebar__soporte {
                padding: 0.75rem;
                text-align: center;
            }

            .hv-sidebar__soporte h3,
            .hv-sidebar__soporte p,
            .hv-sidebar__boton-soporte span {
                display: none;
            }

            .hv-sidebar__boton-soporte {
                padding: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <!-- Aquí dashboard administrativo parte menu IZQ de HuellaVet -->
    <aside class="hv-sidebar">

        <!-- Aqui marca principal de HuellaVet -->
        <div class="hv-sidebar__marca">

            <!-- Logo de HuellaVet -->
            <img src="../img/icon-huella-de-perro.png" alt="Logo de HuellaVet" class="hv-sidebar__logo">

            <!-- Nombre de la aplicación -->
            <span>HuellaVet</span>


            <!-- Cierre marca principal de HuellaVet -->
        </div>

        <!-- Menú principal del sidebar -->
        <nav class="hv-sidebar__menu">

            <!-- Opción Dashboard activa -->
            <a href="#" class="hv-sidebar__link hv-sidebar__link--activo">
                <i class="bi bi-grid"></i>
                <span>Dashboard</span>
            </a>

            <!-- Opción Citas -->
            <a href="#" class="hv-sidebar__link">
                <i class="bi bi-calendar3"></i>
                <span>Citas</span>
            </a>

            <!-- Opción Mascotas -->
            <a href="#" class="hv-sidebar__link">
                <i class="bi bi-heart"></i>
                <span>Mascotas</span>
            </a>

            <!-- Opción Clientes -->
            <a href="#" class="hv-sidebar__link">
                <i class="bi bi-people"></i>
                <span>Clientes</span>
            </a>

            <!-- Opción Servicios -->
            <a href="#" class="hv-sidebar__link">
                <i class="bi bi-briefcase"></i>
                <span>Servicios</span>
            </a>

            <!-- Opción Configuración -->
            <a href="#" class="hv-sidebar__link">
                <i class="bi bi-gear"></i>
                <span>Configuración</span>
            </a>

            <!-- Cierre menú principal del sidebar -->
        </nav>

        <!-- Bloque de ayuda ubicado en la parte inferior del sidebar -->
        <div class="hv-sidebar__soporte">

            <!-- Título del bloque de ayuda -->
            <h3>¿Necesitas ayuda?</h3>

            <!-- Mensaje de apoyo -->
            <p>Estamos aquí para ayudarte.</p>

            <!-- Botón visual de soporte -->
            <a href="#" class="hv-sidebar__boton-soporte">
                <i class="bi bi-headset"></i>
                <span>Soporte</span>
            </a>
            <!-- Cierro el bloque de ayuda ubicado en la parte inferior del sidebar -->
        </div>

        <!-- Cierre dashboard administrativo parte menu IZQ de HuellaVet -->
    </aside>



    <!-- Se conecta el Js de Bootstrap al final de la página -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>


</body>

</html>
