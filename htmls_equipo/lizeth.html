<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de contacto | HuellaVet</title>

    <!-- Conecto Bootstrap para utilizar su sistema de columnas y formularios -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Conecto Bootstrap Icons para usar los iconos del formulario -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Conecto las fuentes definidas para la identidad de HuellaVet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* Se crean variables para reutilizar los colores y fuentes del proyecto */
        :root {
            --color-primario: #17a9a7;
            --color-primario-oscuro: #007981;
            --color-secundario-claro: #a5d9cf;
            --color-acento: #bad641;
            --color-fondo-claro: #eef5e5;
            --color-texto-oscuro: #223e3c;
            --color-borde: #d8e3df;

            --fuente-principal: "Quicksand", sans-serif;
            --fuente-marca: "Sour Gummy", sans-serif;
        }

        /* Se aplica la fuente principal a toda mi página de prueba */
        body {
            font-family: var(--fuente-principal);
            color: var(--color-texto-oscuro);
            background-color: #f7faf8;
        }

        /* Se crea el espacio general donde voy a mostrar el formulario */
        .contacto {
            padding: 3rem 1rem;
        }

        /* Se limita el ancho del formulario y se centra */
        .contacto__contenedor {
            max-width: 950px;
        }

        /* Se crea la tarjeta blanca que contiene todo el formulario */
        .formulario-contacto {
            padding: 2rem;
            background-color: #ffffff;
            border: 1px solid var(--color-borde);
            border-radius: 1.25rem;
            box-shadow: 0 0.75rem 2rem rgba(34, 62, 60, 0.08);
        }

        /* Se organiza el icono y el título en una misma fila */
        .formulario-contacto__encabezado {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        /* Se diseño el fondo que contiene el icono del encabezado */
        .formulario-contacto__icono-titulo {
            display: grid;
            width: 3rem;
            height: 3rem;
            place-items: center;
            flex-shrink: 0;
            color: var(--color-primario-oscuro);
            background-color: var(--color-fondo-claro);
            border-radius: 0.75rem;
            font-size: 1.4rem;
        }

        /* Se aplica el diseño del título principal */
        .formulario-contacto__titulo {
            margin: 0;
            font-family: var(--fuente-marca);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Se ubica cada icono dentro de su campo correspondiente */
        .formulario-contacto__campo {
            position: relative;
        }

        .formulario-contacto__campo i {
            position: absolute;
            top: 50%;
            left: 1rem;
            z-index: 2;
            color: var(--color-primario-oscuro);
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Se personaliza los campos de Bootstrap */
        .formulario-contacto__campo .form-control {
            min-height: 3rem;
            padding-left: 2.75rem;
            border-color: var(--color-borde);
            border-radius: 0.65rem;
            box-shadow: none;
        }

        /* Se resalta el campo que el usuario está utilizando */
        .formulario-contacto__campo .form-control:focus {
            border-color: var(--color-primario);
            box-shadow: 0 0 0 0.2rem rgba(23, 169, 167, 0.12);
        }

        /* Se diseño las etiquetas de los campos */
        .form-label {
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .formulario-contacto__error {
            display: none;
            margin-top: 0.35rem;
            font-size: 0.8rem;
            color: #c0392b;
        }

        .formulario-contacto__campo.es-invalido .form-control {
            border-color: #c0392b;
        }

        .formulario-contacto__campo.es-invalido .formulario-contacto__error {
            display: block;
        }

        #estado-envio {
            display: none;
            margin-top: 1.25rem;
        }

        /* Se adapto la tarjeta para pantallas pequeñas */
        @media (max-width: 767px) {
            .contacto {
                padding: 2rem 0.75rem;
            }

            .formulario-contacto {
                padding: 1.25rem;
            }
        }
    </style>
</head>

<body>

    <!-- Se creo el contenido principal de mi página de prueba -->
    <main class="contacto">

        <!-- Se centro el formulario y controlo su ancho con Bootstrap -->
        <div class="contacto__contenedor container">

            <!-- Se creo la tarjeta principal del formulario -->
            <div class="formulario-contacto">

                <!-- Se creo el formulario que después enviaré mediante Formspree -->
                <form
                    id="formulario-contacto"
                    action="https://formspree.io/f/ID-DEL-FORMULARIO"
                    method="POST"
                    novalidate
                >

                    <!-- Se creo el encabezado de mi formulario -->
                    <div class="formulario-contacto__encabezado">

                        <div class="formulario-contacto__icono-titulo">
                            <i class="bi bi-envelope-fill"></i>
                        </div>

                        <h2 class="formulario-contacto__titulo">
                            Envíame un mensaje
                        </h2>

                    </div>

                    <!-- Se organizan cuatro campos con la cuadrícula de Bootstrap -->
                    <div class="row g-3">

                        <!-- Se creo el campo para recibir el nombre del propietario -->
                        <div class="col-12 col-md-6">
                            <label for="nombre-propietario" class="form-label">
                                Nombre del propietario
                            </label>

                            <div class="formulario-contacto__campo" data-campo="nombre">
                                <i class="bi bi-person"></i>

                                <input
                                    type="text"
                                    id="nombre-propietario"
                                    name="nombre_propietario"
                                    class="form-control"
                                    placeholder="Tu nombre"
                                    autocomplete="name"
                                    required
                                >
                                <div class="formulario-contacto__error">
                                    escribe un nombre válido (solo letras y espacios, mínimo 3 caracteres).
                                </div>
                            </div>
                        </div>

                        <!-- Se creo el campo para recibir el teléfono -->
                        <div class="col-12 col-md-6">
                            <label for="telefono" class="form-label">
                                Teléfono
                            </label>

                            <div class="formulario-contacto__campo" data-campo="telefono">
                                <i class="bi bi-telephone"></i>

                                <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    class="form-control"
                                    placeholder="+57 300 123 4567"
                                    autocomplete="tel"
                                    required
                                >
                                <div class="formulario-contacto__error">
                                    Ingresa un teléfono válido (mínimo 7 dígitos).
                                </div>
                            </div>
                        </div>

                        <!-- Se creo el campo para recibir la dirección -->
                        <div class="col-12 col-md-6">
                            <label for="direccion" class="form-label">
                                Dirección
                            </label>

                            <div class="formulario-contacto__campo">
                                <i class="bi bi-geo-alt"></i>

                                <input
                                    type="text"
                                    id="direccion"
                                    name="direccion"
                                    class="form-control"
                                    placeholder="Dirección de residencia"
                                    autocomplete="street-address"
                                >
                            </div>
                        </div>

                        <!-- Se creo el campo para recibir el correo electrónico -->
                        <div class="col-12 col-md-6">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <div class="formulario-contacto__campo" data-campo="correo">
                                <i class="bi bi-envelope"></i>

                                <input
                                    type="email"
                                    id="correo"
                                    name="email"
                                    class="form-control"
                                    placeholder="tu@email.com"
                                    autocomplete="email"
                                    required
                                >
                                <div class="formulario-contacto__error">
                                    Ingresa un correo electrónico con un formato válido.
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Aquí mi compañera continuara con los datos de la mascota -->
                    <div class="container my-5">
                    <h1 class="text-center mb-4"><strong>Información de tu mascota</strong></h1>
                    <!-- Primera fila -->
                    <div class="row">
                        <!-- Primera parte -->
                        <div class="col-md-6">
                            <label class="form-label">Nombre de la mascota:</label>
                            <input type="text" class="form-control" id="nombreMascota" name="nombre_mascota" placeholder="nombre de tu mascota">
                        </div>
                        <!-- Segunda parte -->
                        <div class="col-md-6">
                            <label for="especie" class="form-label">Especie:</label>
                            <select class="form-select" id="especie" name="especie">
                                <option value="">Selecciona la especie</option>
                                <option value="perro">Perro</option>
                                <option value="gato">Gato</option>
                                <option value="ave">Ave</option>
                                <option value="ganado">Ganado</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>
                    <!-- Segunda fila -->
                    <div class="row">
                        <!-- Primera parte -->
                        <div class="col-md-4">
                            <label for="raza" class="form-label">Raza:</label>
                            <input type="text" class="form-control" id="raza" name="raza" placeholder="raza de tu mascota">
                        </div>
                        <!-- Segunda parte -->
                        <div class="col-md-4">
                            <label for="edad" class="form-label">Edad:</label>
                            <input type="number" class="form-control" id="edad" name="edad" placeholder="edad de tu mascota">
                        </div>
                        <!-- Tercera parte -->
                        <div class="col-md-4">
                            <label for="peso" class="form-label">Peso:</label>
                            <input type="number" class="form-control" id="peso" name="peso" placeholder="peso de tu mascota">
                        </div>
                    </div>
                    <!-- Tercera fila -->
                    <div class="row">
                        <!-- Primera parte -->
                        <div class="col-md-6">
                            <label for="sexo" class="form-label">Sexo:</label>
                            <select class="form-select" id="sexo" name="sexo">
                                <option value="">Selecciona el sexo</option>
                                <option value="macho">Macho</option>
                                <option value="hembra">Hembra</option>
                            </select>
                        </div>
                        <!-- Segunda parte -->
                        <div class="col-md-6">
                            <label for="servicio" class="form-label">Servicio:</label>
                            <select class="form-select" id="servicio" name="servicio">
                                <option value="">Selecciona el servicio</option>
                                <option value="consulta">Consulta general</option>
                                <option value="vacuna">Vacunación</option>
                                <option value="esterilizacion">Esterilización</option>
                                <option value="toma-muestras">Toma de Muestras</option>
                                <option value="control">Control</option>
                                <option value="desparasitacion">Desparasitación</option>
                                <option value="imagenes-diagnosticas">Imágenes diagnósticas</option>

                            </select>
                        </div>
                    </div>
                    <!-- Cuarta fila -->
                    <div class="row">
                        <!-- Primera parte -->
                        <div class="col-md-12">
                            <label for="mensaje" class="form-label">Mensaje:</label>
                            <!-- NUEVO: envuelvo el textarea en formulario-contacto__campo para poder validarlo igual que los demás -->
                            <div class="formulario-contacto__campo" data-campo="mensaje">
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="3" placeholder="Cuéntanos cómo podemos ayudarte..." required></textarea>

                                <!-- NUEVO -->
                                <div class="formulario-contacto__error">
                                    Escribe un mensaje de al menos 10 caracteres.
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Botón de envío -->
                    <div class="row mt-4">
                        <div class="col text-center">
                            <button type="submit" class="btn btn-success" id="boton-enviar">Enviar</button>
                    </div>

                </div>
                <div id="estado-envio" class="alert" role="alert"></div>

                </form>

            </div>

        </div>

    </main>

    <!-- Se conecta el Js de Bootstrap al final de la página -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script src="../js/app.js"></script>
</body>

</html>
