<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/HuellaVet-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/9868a66798.js" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/agendarcita.css">
    <script src="js/components.js" defer></script>
    <script src="js/authmodal.js" defer></script>
    <title>HuellaVet | Agendar Cita</title>

 
</head>

<body>
    <div id="header-container"></div>
    <div id="authmodal-container"></div>

    <main class="contenido-principal">
        <section id="hero-agendarcita" class="hero-agendarcita">
            <div class="container">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-5 hero-agendarcita__contenido">
                        <p class="hero-agendarcita__etiqueta">
                            <i class="bi bi-paw-fill" aria-hidden="true"></i>
                            Agendar una cita
                        </p>
                        <h1 class="hero-agendarcita__titulo">
                            Agenda la mejor atención para tu <span>mejor amigo</span>
                        </h1>
                        <p class="hero-agendarcita__descripcion">
                            Completa el formulario en tres pasos y agenda la mejor atención para tu mascota
                        </p>
                    </div>
                    <div class="col-12 col-lg-7">
                        <div class="hero-agendarcita__imagen-contenedor">
                            <img src="../img/hero-agendarcita..png" class="img-fluid hero-agendarcita__imagen"
                                alt="Perro y gato representando la atención veterinaria de HuellaVet">
                        </div>
                    </div>
                </div>
            </div>
        </section>



        
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
</body>

</html>
