<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuellaVet</title>
    <link rel="icon" href="../img/HuellaVet-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .titulo-miforma {
            display: flex;
            justify-content: center;
            color: #223E3C;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        
        .contenedor-icono {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        
        .circulo-icono {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #e6f2f3; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        
        .circulo-icono i {
            font-size: 2.5rem;
            color: #007981;
        }
    </style>
</head>

<body>

    <!-- MI FORMA DE CUIDAR -->
    <section class="container mt-4 mb-5">
        <p class="titulo-miforma">Mi forma de cuidar</p>

        <div class="row row-cols-1 row-cols-lg-3 g-4">
            <!-- Tarjeta 1 -->
            <div class="col">
                <div class="card h-100">
                    
                    <div class="row g-0 h-100 align-items-center">
                        
                        <div class="col-4 contenedor-icono">
                            <div class="circulo-icono">
                                <i class="bi bi-clipboard2-heart"></i>
                            </div>
                        </div>
                        
                        <div class="col-8">
                            <div class="card-body">
                                <h5 class="card-title">Atención cercana</h5>
                                <p class="card-text">Cuidado empático y personalizado para cada mascota y familia.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div class="col">
                <div class="card h-100">
                    <div class="row g-0 h-100 align-items-center">
                        <div class="col-4 contenedor-icono">
                            <div class="circulo-icono">
                                <i class="bi bi-clipboard-pulse"></i>
                            </div>
                        </div>
                        <div class="col-8">
                            <div class="card-body">
                                <h5 class="card-title">Bienestar animal</h5>
                                <p class="card-text">Priorizo la salud integral y el bienestar en cada etapa.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 3 -->
            <div class="col">
                <div class="card h-100">
                    <div class="row g-0 h-100 align-items-center">
                        <div class="col-4 contenedor-icono">
                            <div class="circulo-icono">
                                <i class="bi bi-chat-right-text"></i>
                            </div>
                        </div>
                        <div class="col-8">
                            <div class="card-body">
                                <h5 class="card-title">Comunicación clara</h5>
                                <p class="card-text">Te explico cada paso con transparencia y confianza.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
