<header class="topbar">

    <!-- =========================
         LADO IZQUIERDO
    ========================== -->
    <div class="topbar-left">

        <button
            type="button"
            class="topbar-menu"
            id="topbarMenuButton"
            aria-label="Abrir o cerrar menú"
        >
            <i class="bi bi-list"></i>
        </button>


        <div class="topbar-title-wrapper">

            <h1
                class="topbar-title"
                id="topbarPageTitle"
            >
                Resumen
            </h1>

            <i class="bi bi-heart-pulse topbar-title-icon"></i>

        </div>

    </div>


    <!-- =========================
         LADO DERECHO
    ========================== -->
    <div class="topbar-right">

        <!-- BOTÓN AGENDAR CITA (Mismos estilos que Agregar servicio en Admin) -->
        <a
            href="../../agendar.html"
            class="topbar-add-service topbar-agendar-btn"
            data-abrir-agendar-cita
        >
            <i class="bi bi-plus-lg"></i>
            <span>Agendar cita</span>
        </a>

          


        <!-- NOTIFICACIONES -->
        <button
            type="button"
            class="topbar-notification"
            id="notificationButton"
            aria-label="Notificaciones"
        >
            <i class="bi bi-bell"></i>
            <span class="topbar-notification-badge">
                2
            </span>
        </button>


        <!-- PERFIL DE USUARIO -->
        <div class="topbar-profile">

            <button
                type="button"
                class="topbar-profile-button"
                id="profileButton"
            >
                <div class="topbar-user-avatar">
                    <i class="fa-solid fa-paw"></i>
                </div>

                <div class="topbar-profile-info">
                    <span class="topbar-profile-name">
                        Ana García
                    </span>
                    <span class="topbar-profile-role">
                        ana.garcia@email.com
                    </span>
                </div>

                <i
                    class="bi bi-chevron-down topbar-profile-arrow"
                    id="profileArrow"
                ></i>

            </button>


            <!-- MENÚ DESPLEGABLE -->
            <div
                class="topbar-profile-menu"
                id="profileMenu"
            >

                <div class="topbar-profile-header">
                    <strong>Ana García</strong>
                    <small>ana.garcia@email.com</small>
                </div>

                <hr class="dropdown-divider my-1">

                <a
                    href="./user-perfil.html"
                    class="topbar-profile-item"
                >
                    <i class="bi bi-person"></i>
                    <span>Mi perfil</span>
                </a>

                <a
                    href="#"
                    class="topbar-profile-item"
                >
                    <i class="bi bi-heart"></i>
                    <span>Mis mascotas</span>
                </a>

                <hr class="dropdown-divider my-1">

                <a
                    href="../../somos.html"
                    class="topbar-profile-item text-danger"
                >
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Cerrar sesión</span>
                </a>

            </div>

        </div>

    </div>

</header>
