<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | HuellaVet</title>
    <link rel="icon" href="../../img/HuellaVet-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos de componentes modulares -->
    <link rel="stylesheet" href="../css/user-sidebar.css">
    <link rel="stylesheet" href="../css/user-topbar.css">
    <link rel="stylesheet" href="../css/user-perfil.css">
</head>

<body data-page="perfil" data-page-title="Mi Perfil">

    <!-- CONTENEDOR SIDEBAR (Componente Dinámico) -->
    <div id="sidebar-container"></div>

    <div class="user-page">

        <!-- CONTENEDOR TOPBAR (Componente Dinámico) -->
        <div id="topbar-container"></div>

        <main class="user-dashboard-content">

            <div class="perfil-container">
                <div class="perfil-header">
                    <div class="perfil-avatar">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="perfil-title">
                        <h3 id="perfil-nombre-completo">Cargando...</h3>
                        <p id="perfil-email">cargando...</p>
                    </div>
                </div>

                <div class="perfil-grid">
                    <div class="perfil-item">
                        <label>Nombre completo</label>
                        <div class="perfil-valor" id="info-nombre">Cargando...</div>
                    </div>
                    <div class="perfil-item">
                        <label>Correo electrónico</label>
                        <div class="perfil-valor" id="info-email">Cargando...</div>
                    </div>
                    <div class="perfil-item">
                        <label>Teléfono</label>
                        <div class="perfil-valor" id="info-telefono">Cargando...</div>
                    </div>
                    <div class="perfil-item">
                        <label>Ubicación / Ciudad</label>
                        <div class="perfil-valor" id="info-ciudad">No especificada</div>
                    </div>
                    <div class="perfil-item">
                        <label>Fecha de nacimiento</label>
                        <div class="perfil-valor" id="info-fecha-nacimiento">No especificada</div>
                    </div>
                </div>
                
                <div class="mt-4 text-end">
                    <button class="btn btn-outline-secondary" disabled>
                        <i class="bi bi-pencil-square me-1"></i> Editar Perfil (Próximamente)
                    </button>
                </div>
            </div>

        </main>

    </div>

    <!-- componente agendar cita -->
    <div
        id="agendar-cita-container"
        data-agendar-html="../../components/agendar-cita/agendar-cita.html"
        data-agendar-css-modal="../../components/agendar-cita/agendar-cita.css"
        data-agendar-css-formulario="../../css/agendar.css"
        data-agendar-js="../../js/agendar.js"
    ></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/components.js"></script>
    <script src="../js/user-sidebar.js"></script>
    <script src="../js/user-topbar.js"></script>
    <script src="../../js/shared/local-storage.js"></script>
    <script src="../../js/shared/citas-storage.js"></script>
    <script src="../../js/shared/mascotas-storage.js"></script>
    <script src="../../js/shared/usuarios-storage.js"></script>
    <script src="../../js/shared/servicios-storage.js"></script>
    <script src="../../js/shared/tipos-servicio-storage.js"></script>
    <script src="../../js/shared/data-migrations.js"></script>
    <script src="../js/user-perfil.js"></script>
    <script src="../../components/agendar-cita/agendar-cita.js"></script>

</body>

</html>
