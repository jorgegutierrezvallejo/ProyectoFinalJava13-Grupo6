<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configuración | HuellaVet</title>
    <link rel="icon" href="../../img/HuellaVet-icon.svg" type="image/svg+xml">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="../css/veterinario-sidebar.css">

    <link rel="stylesheet" href="../css/top-bar.css">

    <link rel="stylesheet" href="../css/veterinario-configuracion.css">
</head>


<body data-page="configuracion" data-page-title="Configuración">

    <div id="sidebar-container"></div>


    <div class="admin-page">

        <div id="topbar-container"></div>


        <main class="admin-configuracion">
            <section class="configuracion-layout" aria-label="Configuración de la cuenta">
                <aside class="configuracion-menu" aria-label="Secciones de configuración">
                    <h2>Configuración</h2>

                    <nav class="configuracion-menu__nav" role="tablist" aria-label="Opciones de configuración">
                        <button class="configuracion-menu__opcion configuracion-menu__opcion--activa" type="button"
                            role="tab" aria-selected="true" aria-controls="panel-perfil" data-config-tab="perfil">
                            <i class="bi bi-person"></i>
                            <span>Perfil</span>
                        </button>
                        <button class="configuracion-menu__opcion" type="button" role="tab" aria-selected="false"
                            aria-controls="panel-cuenta" data-config-tab="cuenta">
                            <i class="bi bi-person"></i>
                            <span>Cuenta</span>
                        </button>
                    </nav>
                </aside>

                <div class="configuracion-contenido">
                    <section class="configuracion-panel" id="panel-perfil" role="tabpanel" data-config-panel="perfil">
                        <header class="configuracion-panel__encabezado">
                            <span class="configuracion-panel__icono"><i class="bi bi-person"></i></span>
                            <div>
                                <h2>Perfil</h2>
                                <p>Administra tu información personal y datos de contacto.</p>
                            </div>
                        </header>

                        <form id="formPerfilAdmin" class="configuracion-form" novalidate>
                            <div class="configuracion-foto">
                                <div class="configuracion-foto__imagen">
                                    <div class="configuracion-foto__preview" id="fotoPerfilPreview"
                                        aria-label="Foto de perfil">
                                        <img src="../../img/HuellaVet-icon.svg" alt="Foto de perfil">
                                    </div>
                                </div>
                                <div class="configuracion-foto__texto">
                                    <strong>Foto de perfil</strong>
                                </div>
                            </div>

                            <div class="configuracion-form__grid">
                                <label class="configuracion-campo">
                                    <span>Nombre(s)</span>
                                    <span class="configuracion-campo__control">
                                        <input id="adminNombres" name="nombres" type="text" value=""
                                            disabled required>
                                    </span>
                                </label>

                                <label class="configuracion-campo">
                                    <span>Apellido(s)</span>
                                    <span class="configuracion-campo__control">
                                        <input id="adminApellidos" name="apellidos" type="text" value=""
                                            disabled required>
                                    </span>
                                </label>

                                <label class="configuracion-campo">
                                    <span>Teléfono</span>
                                    <span class="configuracion-campo__telefono">
                                        <select id="adminIndicativo" name="indicativo" disabled
                                            aria-label="Indicativo telefónico">
                                            <option value="+57">CO +57</option>
                                            <option value="+52">MX +52</option>
                                            <option value="+1">US +1</option>
                                        </select>
                                        <span class="configuracion-campo__control">
                                            <input id="adminTelefono" name="telefono" type="tel" value=""
                                                disabled required>
                                            <button type="button" class="configuracion-campo__editar"
                                                data-edit-field="adminTelefono" aria-label="Editar teléfono"><i
                                                    class="bi bi-pencil"></i></button>
                                        </span>
                                    </span>
                                </label>

                                <label class="configuracion-campo">
                                    <span>Ciudad</span>
                                    <span class="configuracion-campo__control">
                                        <input id="adminCiudad" name="ciudad" type="text" value=""
                                            disabled required>
                                        <button type="button" class="configuracion-campo__editar"
                                            data-edit-field="adminCiudad" aria-label="Editar ciudad"><i
                                                class="bi bi-pencil"></i></button>
                                    </span>
                                </label>
                            </div>

                            <div class="configuracion-acciones">
                                <button class="configuracion-boton configuracion-boton--primario" type="submit"><i
                                        class="bi bi-floppy"></i> Guardar perfil</button>
                                <button class="configuracion-boton configuracion-boton--secundario" type="button"
                                    data-cancelar-form="perfil"><i class="bi bi-x-lg"></i> Cancelar</button>
                            </div>
                        </form>
                    </section>

                    <section class="configuracion-panel" id="panel-cuenta" role="tabpanel" data-config-panel="cuenta"
                        hidden>
                        <header class="configuracion-panel__encabezado">
                            <span class="configuracion-panel__icono"><i class="bi bi-person"></i></span>
                            <div>
                                <h2>Cuenta</h2>
                                <p>Gestiona tu acceso y seguridad.</p>
                            </div>
                        </header>

                        <form id="formCuentaAdmin" class="configuracion-form configuracion-form--cuenta" novalidate>
                            <h3>Acceso de la cuenta</h3>
                            <div class="configuracion-form__cuenta-campos">
                                <label class="configuracion-campo">
                                    <span>Correo electrónico</span>
                                    <span class="configuracion-campo__control">
                                        <input id="adminCorreo" name="correo" type="email" value=""
                                            disabled required>
                                    </span>
                                </label>
                                <label class="configuracion-campo">
                                    <span>Contraseña</span>
                                    <span class="configuracion-campo__control">
                                        <input id="adminContrasena" name="contrasena" type="password"
                                            value="••••••••" disabled required>
                                        <button type="button" class="configuracion-campo__editar"
                                            data-open-password-modal aria-label="Cambiar contraseña"><i
                                                class="bi bi-pencil"></i></button>
                                    </span>
                                </label>
                            </div>
                            <div class="configuracion-acciones configuracion-acciones--cuenta">
                                <button class="configuracion-boton configuracion-boton--primario" type="button"
                                    id="abrirModalContrasena"><i class="bi bi-lock"></i> Actualizar contraseña</button>
                            </div>
                        </form>
                    </section>
                </div>
            </section>

        </main>

    </div>

    <div class="configuracion-modal" id="modalContrasena" aria-hidden="true" role="dialog" aria-modal="true"
        aria-labelledby="tituloModalContrasena">
        <div class="configuracion-modal__contenedor">
            <header class="configuracion-modal__encabezado">
                <span class="configuracion-panel__icono"><i class="bi bi-lock"></i></span>
                <div>
                    <h2 id="tituloModalContrasena">Cambiar contraseña</h2>
                    <p>Te recomendamos usar una contraseña segura con letras, números y símbolos.</p>
                </div>
            </header>
            <form id="formCambiarContrasena" class="configuracion-modal__form" novalidate>
                <label class="configuracion-campo">
                    <span>Contraseña actual</span>
                    <span class="configuracion-campo__control">
                        <input id="contrasenaActual" type="password" required autocomplete="current-password">
                        <button type="button" class="configuracion-campo__ver" data-toggle-password="contrasenaActual"
                            aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                    </span>
                </label>
                <label class="configuracion-campo">
                    <span>Nueva contraseña</span>
                    <span class="configuracion-campo__control">
                        <input id="nuevaContrasena" type="password" minlength="8" maxlength="20" required autocomplete="new-password">
                        <button type="button" class="configuracion-campo__ver" data-toggle-password="nuevaContrasena"
                            aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                    </span>
                </label>
                <label class="configuracion-campo">
                    <span>Confirmar nueva contraseña</span>
                    <span class="configuracion-campo__control">
                        <input id="confirmarContrasena" type="password" minlength="8" maxlength="20" required
                            autocomplete="new-password">
                        <button type="button" class="configuracion-campo__ver"
                            data-toggle-password="confirmarContrasena" aria-label="Mostrar contraseña"><i
                                class="bi bi-eye"></i></button>
                    </span>
                </label>
                <p class="configuracion-modal__error" id="errorContrasena" role="alert"></p>
                <div class="configuracion-acciones configuracion-modal__acciones">
                    <button class="configuracion-boton configuracion-boton--primario" type="submit"><i
                            class="bi bi-lock"></i> Actualizar contraseña</button>
                    <button class="configuracion-boton configuracion-boton--secundario" type="button"
                        data-cerrar-modal><i class="bi bi-x-lg"></i> Cancelar</button>
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../js/config.js"></script>

    <script src="../../js/shared/local-storage.js"></script>
    <script src="../../js/shared/usuarios-storage.js"></script>
    <script src="../../js/shared/mascotas-storage.js"></script>
    <script src="../../js/shared/citas-storage.js"></script>
    <script src="../../js/shared/servicios-storage.js"></script>
    <script src="../../js/shared/tipos-servicio-storage.js"></script>
    <script src="../js/veterinario-sidebar.js"></script>
    <script src="../js/topbar.js"></script>

    <script src="../js/veterinario-configuracion.js"></script>

</body>

</html>
