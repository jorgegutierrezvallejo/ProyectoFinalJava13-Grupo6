<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuellaVet Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #f7faf8;

            font-family: "Quicksand", sans-serif;

            color: #223e3c;
        }

        .welcome-card {
            width: min(90%, 420px);

            padding: 36px 28px;

            text-align: center;

            background-color: #ffffff;

            border: 1px solid #d8e3df;
            border-radius: 14px;

            box-shadow: 0 8px 24px rgba(34, 62, 60, 0.08);
        }

        .welcome-logo {
            width: 82px;
            height: 82px;

            margin-bottom: 16px;
        }

        .welcome-card h1 {
            margin-bottom: 10px;

            font-family: "Sour Gummy", sans-serif;

            font-size: 34px;
            font-weight: 700;
        }

        .welcome-card p {
            margin-bottom: 24px;

            color: #5f6f72;

            font-size: 16px;
        }

        .btn-dashboard {
            min-height: 46px;

            padding: 0 24px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 10px;

            background-color: #bad641;

            color: #223e3c;

            font-weight: 700;

            text-decoration: none;
        }

        .btn-dashboard:hover {
            background-color: #a8c22b;

            color: #223e3c;
        }
    </style>
</head>

<body>

    <main class="welcome-card">
        <img
            src="./img/HuellaVet-icon.svg"
            alt="Logo HuellaVet"
            class="welcome-logo"
        >

        <h1>HuellaVet</h1>

        <p>Bienvenido al Dashboard de HuellaVet.</p>

        <a href="./admin/html/admin-dashboard.html" class="btn-dashboard">
            Ir al Dashboard
        </a>
    </main>

</body>

</html>
