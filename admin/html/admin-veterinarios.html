<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veterinarios | HuellaVet Admin</title>
    <link rel="icon" href="../../img/HuellaVet-icon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/top-bar.css">
    <link rel="stylesheet" href="../css/admin-panel.css">

</head>

<body data-page="veterinarios" data-page-title="Veterinarios">

    <div id="sidebar-container"></div>

    <div class="admin-page">

        <div id="topbar-container"></div>

        <main class="admin-panel-main">

            <h1>Veterinarios</h1>
            <p class="subtitulo">Asigna el permiso de veterinario y habilita o inhabilita cuentas.</p>

            <div class="admin-panel-card">
                <div class="admin-panel-card__encabezado">
                    <h2>Registrar nuevo veterinario</h2>
                </div>

                <div id="formVeterinarioError" class="admin-panel-error" style="display:none;"></div>

                <form id="formNuevoVeterinario">
                    <div class="admin-form-grid">
                        <div>
                            <label for="vetNombres">Nombres</label>
                            <input type="text" id="vetNombres" required maxlength="30">
                        </div>
                        <div>
                            <label for="vetApellidos">Apellidos</label>
                            <input type="text" id="vetApellidos" required maxlength="30">
                        </div>
                        <div>
                            <label for="vetCorreo">Correo</label>
                            <input type="email" id="vetCorreo" required maxlength="150">
                        </div>
                        <div>
                            <label for="vetContrasena">Contraseña temporal</label>

                            <div class="position-relative">
                                <input
                                    type="password"
                                    id="vetContrasena"
                                    required
                                    minlength="8"
                                    maxlength="20"
                                    style="padding-right: 42px;"
                                >

                                <button
                                    type="button"
                                    id="toggleVetContrasena"
                                    aria-label="Mostrar contraseña"
                                    aria-pressed="false"
                                    style="
                                        position: absolute;
                                        right: 10px;
                                        top: 50%;
                                        transform: translateY(-50%);
                                        border: 0;
                                        background: transparent;
                                        padding: 4px;
                                        cursor: pointer;
                                    "
                                >
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="admin-btn admin-btn--primario">
                        <i class="bi bi-plus-lg"></i> Crear veterinario
                    </button>
                </form>
            </div>

            <div class="admin-panel-card">
                <div class="admin-panel-card__encabezado">
                    <h2>Veterinarios registrados</h2>
                </div>

                <div id="listadoVeterinarios">
                    <p class="text-muted">Cargando veterinarios...</p>
                </div>
            </div>

        </main>

    </div>

    <script src="../../js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../js/admin-sidebar.js"></script>
    <script src="../js/topbar.js"></script>
    <script src="../../js/shared/local-storage.js"></script>
    <script src="../../js/shared/usuarios-storage.js"></script>

    <script src="../js/admin-veterinarios.js"></script>

</body>

</html>
