<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios | HuellaVet</title>
    <link rel="icon" href="../../img/HuellaVet-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sour+Gummy:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/top-bar.css">
    <link rel="stylesheet" href="../css/admin-servicios.css">
</head>

<body data-page="servicios" data-page-title="Servicios">

    <div id="sidebar-container"></div>

    <div class="admin-page">
        <div id="topbar-container"></div>

        <main class="admin-servicios">

        
            <section class="servicios-header">
                <div>
                    <h2>Mis servicios</h2>
                    <p>Gestiona y mantén actualizados los servicios que ofreces en tu clínica.</p>
                </div>

                <div class="servicios-total">
                    <i class="bi bi-grid"></i>
                    <span id="totalServicios">0 servicios en total</span>
                </div>
            </section>

            <div class="servicios-filtros">
                <select class="form-select" id="filtroTipoServicio">
                    <option value="" selected>Todos los servicios</option>
                </select>
            </div>

            <section>
                <div id="contenedorServicios" class="servicios-grid"></div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin-sidebar.js"></script>
    <script src="../js/topbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../js/shared/local-storage.js"></script>
    <script src="../../js/shared/servicios-storage.js"></script>
    <script src="../../js/shared/tipos-servicio-storage.js"></script>
    <script src="../js/admin-servicios.js"></script>

</body>

</html>
